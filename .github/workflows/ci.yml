name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/claudiasambatra/g-patient

# Les actions sont épinglées sur un SHA de commit (immuable) plutôt que sur une
# étiquette (déplaçable) : protection contre une action compromise (chaîne d'approvisionnement).
jobs:
  # --------------------------------------------------------------- SECURITE
  # Bloque le pipeline si du code caché réapparaît (malware déjà retrouvé
  # dans postcss.config.mjs, frontend/init et de faux fichiers de polices).
  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lignes anormalement longues
        run: |
          suspects=$(git grep -I -l -E '.{1000,}' -- ':!*.svg' ':!*package-lock.json' ':!*.json' ':!*.min.*' ':!*.lock' || true)
          if [ -n "$suspects" ]; then
            echo "$suspects"
            echo "::error::Ligne de plus de 1000 caractères détectée (code caché possible)."
            exit 1
          fi
      - name: Signatures connues et tâches VS Code automatiques
        run: |
          if git grep -I -n -E "var bx ?= ?'|runOn\"?: ?\"folderOpen|allowAutomaticTasks" -- ':!.github/workflows/ci.yml'; then
            echo "::error::Signature du malware ou tâche VS Code automatique détectée."
            exit 1
          fi
          if git ls-files | grep -iE '\.vscode/tasks\.json$|\.orc$|public/fonts/'; then
            echo "::error::Fichier suspect (tâche VS Code, .orc ou faux dossier de polices)."
            exit 1
          fi
      - name: Aucun fichier de secrets versionné
        run: |
          secrets=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -v '\.example$' || true)
          if [ -n "$secrets" ]; then
            echo "$secrets"
            echo "::error::Fichier .env versionné : retirez-le (git rm --cached) et utilisez un .env.example."
            exit 1
          fi

  # ---------------------------------------------------------------- BACKEND
  backend:
    name: Backend
    needs: [securite]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: 'pip install --only-binary :all: --require-hashes -r requirements-dev.lock'
      - name: Lint (flake8)
        run: flake8 .
      - name: Tests (pytest) et couverture
        # coverage.xml contient le chemin absolu du dossier backend : SonarCloud, lancé depuis
        # le même emplacement, retrouve ainsi les fichiers.
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Publier la couverture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: couverture-backend
          path: backend/coverage.xml

  # ------------------------------------------------------ QUALITÉ (SONAR)
  # Analyse statique SonarCloud : bugs, vulnérabilités, code dupliqué, dette
  # technique et couverture des tests. Ignorée tant que SONAR_TOKEN n'est pas configuré.
  sonarcloud:
    name: Qualité du code
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # historique complet : SonarCloud attribue les problèmes aux commits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: env.SONAR_TOKEN != ''
        with:
          name: couverture-backend
          path: backend
      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5
      - name: SonarCloud non configuré
        if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::Secret SONAR_TOKEN absent, analyse SonarCloud ignorée."'

  # ------------------------------------------------------------ OWASP ZAP
  # Scan de sécurité dynamique (DAST) de l'API sur une instance jetable :
  # base vide, e-mails désactivés, connexion en administrateur pour couvrir les
  # routes protégées par JWT. Le rapport est publié en artefact et dans le résumé.
  zap:
    name: Sécurité API
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zap_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-zap-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: zap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      API_PUBLIC_URL: http://localhost:8000
      ADMIN_USERNAME: zap_admin
      ADMIN_PASSWORD: Zap-CI-${{ github.run_id }}-Scan!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: 'pip install --only-binary :all: --require-hashes -r requirements.lock'

      - name: Démarrer l'API jetable
        run: |
          python manage.py migrate --noinput
          python manage.py setup_admin
          python manage.py collectstatic --noinput
          gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --daemon --access-logfile ../gunicorn.log
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ && break; sleep 1; done

      - name: Description OpenAPI et jeton administrateur
        run: |
          mkdir -p ../zap
          python manage.py spectacular --file ../zap/openapi.yml
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/token/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"$ADMIN_USERNAME\", \"password\": \"$ADMIN_PASSWORD\"}" | jq -r '.access')
          echo "::add-mask::$TOKEN"
          # Ajoute l'en-tête Authorization à chaque requête envoyée par ZAP, et borne la durée
          # du scan actif (20 min au total, 3 min par règle) pour rester sous le timeout du job
          cat > ../zap/auth.prop <<EOF
          replacer.full_list(0).description=jwt
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=Bearer $TOKEN
          scanner.maxScanDurationInMins=20
          scanner.maxRuleDurationInMins=3
          EOF
          sed -i 's/^ *//' ../zap/auth.prop
          cp ../.zap/rules.tsv ../zap/rules.tsv
          # Dossier confié au seul utilisateur « zap » du conteneur (uid 1000), sans droits pour les autres
          chmod 700 ../zap && chmod 600 ../zap/auth.prop && sudo chown -R 1000:1000 ../zap

      # Image ZAP épinglée par son empreinte (digest) : on exécute exactement l'image vérifiée
      - name: Scan OWASP ZAP (API)
        working-directory: .
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-api-scan.py -t openapi.yml -f openapi -c rules.tsv -I \
            -r zap-rapport.html -w zap-rapport.md -J zap-rapport.json \
            -z "-configfile /zap/wrk/auth.prop"

      - name: Résumé du scan
        if: always()
        working-directory: .
        run: |
          sudo rm -f zap/auth.prop
          sudo chown -R "$(id -u)" zap
          if [ -f zap/zap-rapport.md ]; then cat zap/zap-rapport.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publier le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapport-owasp-zap
          path: |
            zap/zap-rapport.html
            zap/zap-rapport.md
            zap/zap-rapport.json
          if-no-files-found: ignore

  # ------------------------------------------------------- TESTS D'API (POSTMAN)
  api-tests:
    name: Tests d'API
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: newman_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-newman-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: newman_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ADMIN_USERNAME: newman_admin
      ADMIN_PASSWORD: Newman-CI-${{ github.run_id }}-Tests!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: 'pip install --only-binary :all: --require-hashes -r requirements.lock'

      - name: Démarrer l'API jetable
        run: |
          python manage.py migrate --noinput
          python manage.py setup_admin
          gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --daemon --access-logfile ../gunicorn.log
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ && break; sleep 1; done

      # Image Newman épinglée par son empreinte (digest), comme ZAP : aucun paquet npm installé
      - name: Collection Postman (Newman)
        working-directory: .
        run: |
          # Newman tourne avec l'identité du runner : rapports écrits sans ouvrir les droits du dossier
          mkdir -p newman
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/postman:/etc/newman:ro" -v "$PWD/newman:/rapports:rw" \
            postman/newman@sha256:d9b5e780ead0026bbb37f3759cd7b10fc8a88cd4030c8266a7c5e343d75a5198 \
            run gestion-patients.postman_collection.json -e ci.postman_environment.json \
            --env-var "baseUrl=http://localhost:8000" --env-var "adminPassword=$ADMIN_PASSWORD" \
            --reporters cli,junit,json \
            --reporter-junit-export /rapports/newman-junit.xml \
            --reporter-json-export /rapports/newman.json

      - name: Résumé des tests d'API
        if: always()
        working-directory: .
        run: |
          [ -f newman/newman.json ] || exit 0
          jq -r '.run.stats as $s | .run.timings as $t |
            "### Tests d'\''API (Postman / Newman)\n",
            "| | Total | Échecs |", "|---|---|---|",
            "| Requêtes | \($s.requests.total) | \($s.requests.failed) |",
            "| Assertions | \($s.assertions.total) | \($s.assertions.failed) |",
            "\nTemps de réponse moyen : \($t.responseAverage | floor) ms (max \($t.responseMax) ms)",
            (if (.run.failures | length) > 0 then "\n**Échecs :**", (.run.failures[] | "- \(.source.name) : \(.error.message)") else empty end)
          ' newman/newman.json >> "$GITHUB_STEP_SUMMARY"
          # Le rapport JSON contient les variables (mot de passe, jetons) : il n'est jamais publié
          rm -f newman/newman.json

      - name: Publier les rapports Newman
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapport-newman
          path: |
            newman/newman-junit.xml
            gunicorn.log
          if-no-files-found: ignore

  # ------------------------------------------------- INFRASTRUCTURE (ANSIBLE)
  # Le playbook est appliqué sur la machine virtuelle jetable du runner (un Ubuntu neuf),
  # comme sur un vrai serveur, puis relancé : la 2e passe doit être sans aucun changement.
  infra:
    name: Infrastructure
    needs: [securite]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/ansible
    env:
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Ansible (préinstallé sur le runner)
        run: ansible --version

      - name: Secrets jetables
        working-directory: .
        run: |
          for v in APP_DJANGO_SECRET_KEY:32 APP_POSTGRES_PASSWORD:16 APP_GRAFANA_PASSWORD:12; do
            valeur=$(openssl rand -hex "${v#*:}")
            echo "::add-mask::$valeur"
            echo "${v%%:*}=$valeur" >> "$GITHUB_ENV"
          done

      - name: Vérification de la syntaxe
        run: ansible-playbook site.yml --syntax-check

      - name: 1re passe — préparation du serveur et déploiement
        run: ansible-playbook site.yml --limit ci

      - name: 2e passe — idempotence (aucun changement attendu)
        env:
          ANSIBLE_FORCE_COLOR: "0"   # récapitulatif sans codes couleur, pour pouvoir le contrôler
          ANSIBLE_NOCOLOR: "1"
        run: |
          ansible-playbook site.yml --limit ci | tee ../../idempotence.log
          if ! grep -qE 'localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0' ../../idempotence.log; then
            echo "::error::La 2e passe a modifié le serveur : le playbook n'est pas idempotent."
            exit 1
          fi

      - name: La pile déployée répond
        run: |
          # Chaque service a jusqu'à 2 minutes pour être prêt (Loki met un peu de temps à démarrer)
          attendre() {
            for _ in $(seq 1 24); do "$@" && return 0; sleep 5; done
            echo "::error::Pas de réponse : $*"; return 1
          }
          cd /opt/gestion-patients
          attendre curl -fsS http://localhost/api/health/
          attendre curl -fsS http://localhost/grafana/api/health
          # Loki joignable depuis Grafana (sa source de données)
          attendre sudo docker compose -f docker-compose.prod.yml exec -T grafana wget -qO- http://loki:3100/ready
          sudo docker compose -f docker-compose.prod.yml ps

      - name: Résumé
        if: always()
        working-directory: .
        run: |
          {
            echo "### Infrastructure (Ansible)"
            echo ""
            echo '```'
            grep -A1 'PLAY RECAP' idempotence.log 2>/dev/null || echo "2e passe non exécutée"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- FRONTEND
  frontend:
    name: Frontend
    needs: [securite]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté (vecteur d'attaque classique)
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm run build

  # ------------------------------------------- BUILD + PUSH GHCR + TRIVY
  images:
    name: Image ${{ matrix.service }}
    needs: [backend, frontend, zap, api-tests, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Rapport de vulnérabilités (n'échoue pas le pipeline au début).
      # Passer exit-code à "1" plus tard pour bloquer sur CRITICAL/HIGH.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ---------------------------------------------------------------- DEPLOY
  # Render (ancien hébergement, render.yaml) est suspendu depuis le 25/11/2026 : seule la VM
  # Google Cloud est déployée. Pour le réactiver, relancer les services depuis le tableau de bord Render.

  # VM Google Cloud (https://gestion-patients.abrdns.com) : le playbook Ansible y déploie les
  # images qui viennent d'être publiées. Sans les secrets GCP_* (fork, dépôt copié), l'étape est sautée.
  deploy-gcp:
    name: Déploiement continu
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deux fusions rapprochées : les déploiements passent l'un après l'autre, jamais en même temps
    concurrency:
      group: deploiement-gcp
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/ansible
    env:
      ANSIBLE_FORCE_COLOR: "0"
      ANSIBLE_NOCOLOR: "1"
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
      GCP_SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
      APP_DJANGO_SECRET_KEY: ${{ secrets.APP_DJANGO_SECRET_KEY }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
      APP_EMAIL_HOST_USER: ${{ secrets.APP_EMAIL_HOST_USER }}
      APP_EMAIL_HOST_PASSWORD: ${{ secrets.APP_EMAIL_HOST_PASSWORD }}
      # Supervision Grafana Cloud (facultatif : sans ces secrets, Alloy ne démarre pas)
      APP_GRAFANA_CLOUD_PROM_URL: ${{ secrets.APP_GRAFANA_CLOUD_PROM_URL }}
      APP_GRAFANA_CLOUD_PROM_USER: ${{ secrets.APP_GRAFANA_CLOUD_PROM_USER }}
      APP_GRAFANA_CLOUD_LOKI_URL: ${{ secrets.APP_GRAFANA_CLOUD_LOKI_URL }}
      APP_GRAFANA_CLOUD_LOKI_USER: ${{ secrets.APP_GRAFANA_CLOUD_LOKI_USER }}
      APP_GRAFANA_CLOUD_TOKEN: ${{ secrets.APP_GRAFANA_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -n "$GCP_SSH_PRIVATE_KEY" ] && [ -n "$GCP_SSH_KNOWN_HOSTS" ] && [ -n "$APP_DATABASE_URL" ]; then
            echo "pret=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets GCP_SSH_PRIVATE_KEY, GCP_SSH_KNOWN_HOSTS ou APP_DATABASE_URL absents : déploiement GCP sauté."
          fi

      - name: Clé SSH de déploiement et empreinte de la VM
        if: steps.secrets.outputs.pret == '1'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GCP_SSH_PRIVATE_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # Empreinte fixée : une VM usurpée (autre clé d'hôte) fait échouer la connexion
          printf '%s\n' "$GCP_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploiement Ansible sur la VM
        if: steps.secrets.outputs.pret == '1'
        run: |
          ansible-playbook site.yml --limit gcp \
            -e ansible_user=github-deploy \
            -e ansible_ssh_private_key_file=~/.ssh/deploiement | tee ../../deploiement-gcp.log

      - name: Le site répond en HTTPS
        if: steps.secrets.outputs.pret == '1'
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors https://gestion-patients.abrdns.com/api/health/
          curl -fsS -o /dev/null -w "Page de connexion : %{http_code}\n" https://gestion-patients.abrdns.com/login

      - name: Résumé
        if: always() && steps.secrets.outputs.pret == '1'
        working-directory: .
        run: |
          {
            echo "### Déploiement continu (VM Google Cloud)"
            echo ""
            echo "https://gestion-patients.abrdns.com"
            echo ""
            echo '```'
