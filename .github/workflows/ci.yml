name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/claudiasambatra/g-patient

# Les actions sont épinglées sur un SHA de commit (immuable) plutôt que sur une
# étiquette (déplaçable) : protection contre une action compromise (chaîne d'approvisionnement).
jobs:
  # --------------------------------------------------------------- SECURITE
  # Bloque le pipeline si du code caché réapparaît (malware déjà retrouvé
  # dans postcss.config.mjs, frontend/init et de faux fichiers de polices).
  securite:
    name: Sécurité (code caché)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lignes anormalement longues
        run: |
          suspects=$(git grep -I -l -E '.{1000,}' -- ':!*.svg' ':!*package-lock.json' ':!*.json' ':!*.min.*' ':!*.lock' || true)
          if [ -n "$suspects" ]; then
            echo "$suspects"
            echo "::error::Ligne de plus de 1000 caractères détectée (code caché possible)."
            exit 1
          fi
      - name: Signatures connues et tâches VS Code automatiques
        run: |
          if git grep -I -n -E "var bx ?= ?'|runOn\"?: ?\"folderOpen|allowAutomaticTasks" -- ':!.github/workflows/ci.yml'; then
            echo "::error::Signature du malware ou tâche VS Code automatique détectée."
            exit 1
          fi
          if git ls-files | grep -iE '\.vscode/tasks\.json$|\.orc$|public/fonts/'; then
            echo "::error::Fichier suspect (tâche VS Code, .orc ou faux dossier de polices)."
            exit 1
          fi
      - name: Aucun fichier de secrets versionné
        run: |
          secrets=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -v '\.example$' || true)
          if [ -n "$secrets" ]; then
            echo "$secrets"
            echo "::error::Fichier .env versionné : retirez-le (git rm --cached) et utilisez un .env.example."
            exit 1
          fi

  # ---------------------------------------------------------------- BACKEND
  backend:
    name: Backend (flake8 + pytest)
    needs: [securite]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: 'pip install --only-binary :all: -r requirements-dev.txt'
      - name: Lint (flake8)
        run: flake8 .
      - name: Tests (pytest) et couverture
        # coverage.xml contient le chemin absolu du dossier backend : SonarCloud, lancé depuis
        # le même emplacement, retrouve ainsi les fichiers.
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Publier la couverture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: couverture-backend
          path: backend/coverage.xml

  # ------------------------------------------------------ QUALITÉ (SONAR)
  # Analyse statique SonarCloud : bugs, vulnérabilités, code dupliqué, dette
  # technique et couverture des tests. Ignorée tant que SONAR_TOKEN n'est pas configuré.
  sonarcloud:
    name: Qualité du code (SonarCloud)
    needs: [backend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # historique complet : SonarCloud attribue les problèmes aux commits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: env.SONAR_TOKEN != ''
        with:
          name: couverture-backend
          path: backend
      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5
      - name: SonarCloud non configuré
        if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::Secret SONAR_TOKEN absent, analyse SonarCloud ignorée."'

  # ------------------------------------------------------------ OWASP ZAP
  # Scan de sécurité dynamique (DAST) de l'API sur une instance jetable :
  # base vide, e-mails désactivés, connexion en administrateur pour couvrir les
  # routes protégées par JWT. Le rapport est publié en artefact et dans le résumé.
  zap:
    name: Sécurité API (OWASP ZAP)
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zap_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-zap-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: zap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      API_PUBLIC_URL: http://localhost:8000
      ADMIN_USERNAME: zap_admin
      ADMIN_PASSWORD: Zap-CI-${{ github.run_id }}-Scan!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: 'pip install --only-binary :all: -r requirements.txt'

      - name: Démarrer l'API jetable
        run: |
          python manage.py migrate --noinput
          python manage.py setup_admin
          python manage.py collectstatic --noinput
          gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --daemon --access-logfile ../gunicorn.log
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ && break; sleep 1; done

      - name: Description OpenAPI et jeton administrateur
        run: |
          mkdir -p ../zap
          python manage.py spectacular --file ../zap/openapi.yml
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/token/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"$ADMIN_USERNAME\", \"password\": \"$ADMIN_PASSWORD\"}" | python -c "import json,sys; print(json.load(sys.stdin)['access'])")
          echo "::add-mask::$TOKEN"
          # Ajoute l'en-tête Authorization à chaque requête envoyée par ZAP, et borne la durée
          # du scan actif (20 min au total, 3 min par règle) pour rester sous le timeout du job
          cat > ../zap/auth.prop <<EOF
          replacer.full_list(0).description=jwt
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=Bearer $TOKEN
          scanner.maxScanDurationInMins=20
          scanner.maxRuleDurationInMins=3
          EOF
          sed -i 's/^ *//' ../zap/auth.prop
          cp ../.zap/rules.tsv ../zap/rules.tsv
          # Dossier confié au seul utilisateur « zap » du conteneur (uid 1000), sans droits pour les autres
          chmod 700 ../zap && chmod 600 ../zap/auth.prop && sudo chown -R 1000:1000 ../zap

      # Image ZAP épinglée par son empreinte (digest) : on exécute exactement l'image vérifiée
      - name: Scan OWASP ZAP (API)
        working-directory: .
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-api-scan.py -t openapi.yml -f openapi -c rules.tsv -I \
            -r zap-rapport.html -w zap-rapport.md -J zap-rapport.json \
            -z "-configfile /zap/wrk/auth.prop"

      - name: Résumé du scan
        if: always()
        working-directory: .
        run: |
          sudo rm -f zap/auth.prop
          sudo chown -R "$(id -u)" zap
          if [ -f zap/zap-rapport.md ]; then cat zap/zap-rapport.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publier le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rapport-owasp-zap
          path: |
            zap/zap-rapport.html
            zap/zap-rapport.md
            zap/zap-rapport.json
          if-no-files-found: ignore

  # --------------------------------------------------------------- FRONTEND
  frontend:
    name: Frontend (eslint + tsc + build)
    needs: [securite]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté (vecteur d'attaque classique)
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm run build

  # ------------------------------------------- BUILD + PUSH GHCR + TRIVY
  images:
    name: Image ${{ matrix.service }} (build, push, Trivy)
    needs: [backend, frontend, zap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Rapport de vulnérabilités (n'échoue pas le pipeline au début).
      # Passer exit-code à "1" plus tard pour bloquer sur CRITICAL/HIGH.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ------------------------------------------------------------- DEPLOY EC2
  deploy:
    name: Déploiement continu sur AWS EC2
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Déploiement via SSH sur AWS EC2 (Optionnel)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_USER" ]; then
            echo "⚠️ Secrets AWS EC2 non configurés. Déploiement ignoré."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "🔍 Vérification de la connectivité avec le serveur AWS EC2..."
          if ! ssh-keyscan -T 5 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "⚠️ Le serveur AWS EC2 est actuellement éteint ou inaccessible. Déploiement ignoré avec succès."
            exit 0
          fi

          ssh -o ConnectTimeout=8 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash << 'EOF' || {
            echo "⚠️ Impossible de se connecter en SSH au serveur EC2. Déploiement ignoré."
            exit 0
          }
            set -e
            echo "🚀 Démarrage du déploiement..."
            cd /home/ubuntu/gestion-patients

            echo "📥 Récupération des dernières modifications de code et configs..."
            git pull origin main

            echo "🐳 Téléchargement des nouvelles images Docker..."
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 Redémarrage des services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🩺 Vérification de l'état de l'application..."
            sleep 5
            docker compose -f docker-compose.prod.yml ps
            curl -f -s http://127.0.0.1/api/health/ > /dev/null && echo "✅ API opérationnelle !"

            echo "🧹 Nettoyage des anciennes images inutilisées..."
            docker image prune -f
            echo "🎉 Déploiement terminé avec succès !"
          EOF

      - name: Déploiement continu sur Render (Optionnel)
        if: always()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "🚀 Déclenchement du déploiement automatique sur Render..."
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" && echo "✅ Déploiement Render déclenché avec succès !" || echo "⚠️ Avertissement : impossible de contacter le Deploy Hook Render."
          else
            echo "ℹ️ Secret RENDER_DEPLOY_HOOK non configuré (Render se déploie automatiquement via son intégration GitHub ou via ce hook si renseigné)."
          fi

