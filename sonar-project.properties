# Analyse de qualité SonarCloud (SonarQube Cloud), lancée par le job « Qualité du code » du CI.
# Les deux clés ci-dessous sont celles affichées par SonarCloud lors de l'import du dépôt.
sonar.projectKey=ClaudiaSambatra_G-Patient
sonar.organization=claudiasambatra
sonar.projectName=Gestion des patients

sonar.sources=backend,frontend/src
sonar.tests=backend
sonar.test.inclusions=backend/**/tests.py,backend/**/test_*.py
sonar.exclusions=backend/**/migrations/**,backend/**/tests.py,backend/**/test_*.py,backend/staticfiles/**,backend/media/**,frontend/src/**/*.svg

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
# Le frontend n'a pas de tests automatisés : il reste analysé (bugs, sécurité, qualité)
# mais n'entre pas dans le calcul de couverture, qui porte sur le backend testé par pytest.
sonar.coverage.exclusions=frontend/**
sonar.sourceEncoding=UTF-8
