# Variables communes à tous les serveurs. Les secrets ne sont jamais écrits ici :
# ils sont lus dans l'environnement (ou peuvent être fournis par ansible-vault).

app_dossier: /opt/gestion-patients
app_utilisateur: deploy
app_domaine: localhost          # adresse IP ou nom de domaine public du serveur

app_django_secret_key: "{{ lookup('ansible.builtin.env', 'APP_DJANGO_SECRET_KEY') }}"
app_postgres_password: "{{ lookup('ansible.builtin.env', 'APP_POSTGRES_PASSWORD') }}"
app_grafana_password: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_PASSWORD') }}"

# Pile déployée :
#   docker-compose.prod.yml : pile complète (PostgreSQL local, Nginx, supervision), HTTP ;
#   docker-compose.vm.yml   : pile légère pour petite VM (base Neon, Caddy + Let's Encrypt).
app_compose_fichier: docker-compose.prod.yml
app_https: "{{ app_compose_fichier == 'docker-compose.vm.yml' }}"
app_schema: "{{ 'https' if app_https | bool else 'http' }}"

# Pile légère uniquement : base externe (Neon), et envoi des e-mails par SMTP (facultatif)
app_database_url: "{{ lookup('ansible.builtin.env', 'APP_DATABASE_URL') }}"
# Mot de passe du compte « admin » de l'application (facultatif : sans lui, le compte n'est pas modifié)
app_admin_mot_de_passe: "{{ lookup('ansible.builtin.env', 'APP_ADMIN_PASSWORD') }}"
app_email_utilisateur: "{{ lookup('ansible.builtin.env', 'APP_EMAIL_HOST_USER') }}"
app_email_mot_de_passe: "{{ lookup('ansible.builtin.env', 'APP_EMAIL_HOST_PASSWORD') }}"

# Pile légère uniquement : supervision via Grafana Cloud (facultatif). Si tout est fourni,
# Alloy démarre sur la VM (profil Compose « supervision ») et y envoie métriques et journaux.
app_grafana_cloud_prom_url: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_CLOUD_PROM_URL') }}"
app_grafana_cloud_prom_user: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_CLOUD_PROM_USER') }}"
app_grafana_cloud_loki_url: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_CLOUD_LOKI_URL') }}"
app_grafana_cloud_loki_user: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_CLOUD_LOKI_USER') }}"
app_grafana_cloud_token: "{{ lookup('ansible.builtin.env', 'APP_GRAFANA_CLOUD_TOKEN') }}"
app_supervision_cloud: >-
  {{ [app_grafana_cloud_prom_url, app_grafana_cloud_prom_user, app_grafana_cloud_loki_url,
      app_grafana_cloud_loki_user, app_grafana_cloud_token] | select | list | length == 5 }}

# Racine du dépôt Git (les fichiers de la pile y sont pris)
depot_racine: "{{ playbook_dir }}/../.."
