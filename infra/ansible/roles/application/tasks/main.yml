- name: Dossiers de l'application
  ansible.builtin.file:
    path: "{{ app_dossier }}/{{ item }}"
    state: directory
    owner: "{{ app_utilisateur }}"
    group: "{{ app_utilisateur }}"
    mode: "0755"
  loop: "{{ ['.'] + (application_fichiers | map('dirname') | select | unique | list) }}"

- name: Fichiers de la pile (Compose, Nginx, supervision, journaux)
  ansible.builtin.copy:
    src: "{{ depot_racine }}/{{ item }}"
    dest: "{{ app_dossier }}/{{ item }}"
    owner: "{{ app_utilisateur }}"
    group: "{{ app_utilisateur }}"
    mode: "0644"
  loop: "{{ application_fichiers }}"

- name: Fichier .env (secrets lus dans l'environnement, jamais versionnés)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dossier }}/.env"
    owner: "{{ app_utilisateur }}"
    group: "{{ app_utilisateur }}"
    mode: "0600"
  no_log: true

- name: Télécharger les images publiées par la CI (GHCR)
  ansible.builtin.command: docker compose -f docker-compose.prod.yml pull --quiet
  args:
    chdir: "{{ app_dossier }}"
  changed_when: false

- name: Lancer ou mettre à jour la pile
  ansible.builtin.command: docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
  args:
    chdir: "{{ app_dossier }}"
  register: application_compose
  # Compose n'affiche « Created », « Recreated » ou « Started » que s'il a réellement changé quelque chose
  changed_when: application_compose.stderr is search('Created|Recreated|Started')

- name: L'API répond derrière Nginx
  ansible.builtin.uri:
    url: http://localhost/api/health/
    return_content: true
  register: application_sante
  until: application_sante.status == 200 and (application_sante.json.status | default('')) == 'ok'
  retries: 30
  delay: 5
