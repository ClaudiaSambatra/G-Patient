# Fichiers de la pile copiés depuis le dépôt (chemins relatifs à la racine du dépôt)
application_fichiers: "{{ application_fichiers_vm if app_https | bool else application_fichiers_prod }}"

application_fichiers_vm:
  - docker-compose.vm.yml
  - infra/Caddyfile
  - infra/alloy/config-vm.alloy

application_fichiers_prod:
  - docker-compose.prod.yml
  - infra/nginx.conf
  - infra/prometheus/prometheus.yml
  - infra/loki/loki-config.yml
  - infra/alloy/config.alloy
  - infra/grafana/provisioning/datasources/datasource.yml
  - infra/grafana/provisioning/dashboards/dashboards.yml
  - infra/grafana/dashboards/supervision.json
  - infra/grafana/dashboards/journaux.json
