# Inventaire des serveurs.
#
# serveurs : machines de déploiement réelles, joignables en SSH (Ubuntu 22.04 / 24.04).
#   Pour déployer sur un nouveau serveur, il suffit d'ajouter son adresse ici :
#     ansible-playbook site.yml --limit serveurs
#
# ci : la machine virtuelle jetable de GitHub Actions, sur laquelle le playbook est testé
#   à chaque modification (job « Infrastructure »).
all:
  children:
    serveurs:
      hosts:
        # demo:
        #   ansible_host: 203.0.113.10
        #   ansible_user: ubuntu
        #   app_domaine: 203.0.113.10

        # VM Google Cloud e2-micro (offre gratuite, us-central1-a), IP statique,
        # domaine ClouDNS pointé vers cette IP. Pile légère : base Neon, Caddy + Let's Encrypt.
        #   ansible-playbook site.yml --limit gcp
        gcp:
          ansible_host: 35.208.8.85
          ansible_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
          ansible_ssh_private_key_file: ~/.ssh/google_compute_engine
          app_domaine: gestion-patients.abrdns.com
          app_compose_fichier: docker-compose.vm.yml
          socle_swap_mo: 2048
    ci:
      hosts:
        localhost:
          ansible_connection: local
          # Le runner GitHub a déjà Docker ; son réseau ne doit pas être filtré
          socle_pare_feu: false
