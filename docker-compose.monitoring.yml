# Supervision et Monitoring — Gestion de Patients
# Stack : Prometheus, Grafana, Node Exporter, cAdvisor
#
# Lancement :
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Accès :
#   - Grafana    : http://localhost:3001  (identifiants : admin / admin)
#   - Prometheus : http://localhost:9090
#   - Node Exp.  : http://localhost:9100
#   - cAdvisor   : http://localhost:8081

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gestion_patients_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gestion_patients_node_exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gestion_patients_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    devices:
      - /dev/kmsg
    command:
      - '-docker='
      - '-raw_cgroup_prefix_whitelist=/system.slice/docker'
      - '-housekeeping_interval=10s'
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gestion_patients_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:3001/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: gestion-patients_default
