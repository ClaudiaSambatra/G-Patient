# Blueprint Render pour le déploiement continu de Cabinet Médical
# Documentation : https://render.com/docs/blueprint-spec
#
# Les deux services tournent à partir des images publiées sur GHCR par la CI (job « images »),
# testées et scannées par Trivy. Le job « deploy » de la CI demande à Render, par Deploy Hook,
# l'image exacte du commit (étiquette = SHA) : un service image ne se redéploie pas tout seul.
# Base de données : PostgreSQL chez Neon (DATABASE_URL).
version: "1"

services:
  # --- Service Backend (Django REST Framework) ------------------------------
  # Au démarrage, entrypoint.sh applique les migrations, collecte les fichiers statiques
  # et crée l'administrateur, puis lance Gunicorn sur $PORT.
  - type: web
    name: gestion-patients-backend
    runtime: image
    image:
      url: ghcr.io/claudiasambatra/g-patient-backend:latest
    region: frankfurt
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false

  # --- Service Frontend (Next.js) --------------------------------------------
  # L'adresse de l'API est figée au build de l'image : variable de dépôt GitHub
  # NEXT_PUBLIC_API_URL (https://gestion-patients-backend.onrender.com/api).
  - type: web
    name: cabinet-medical-by-EJLogiciel
    runtime: image
    image:
      url: ghcr.io/claudiasambatra/g-patient-frontend:latest
    region: frankfurt
    plan: free
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
